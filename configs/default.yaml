# CourtVision settings. Every key is optional: anything left out takes the default in
# courtvision/config.py, and an unknown key is an error (so a typo can't be silently ignored).

models:
  detector: models/player_detector.pt         # YOLO detect: Player, Ref, Ball, Hoop (notebook 01)
  court_keypoints: models/court_keypoints.pt  # YOLO pose: 18 court landmarks (notebook 02)
  device: null                                # null = cuda if available

detection:
  imgsz: 1280          # broadcast balls are 15-30 px at 1280; smaller loses them
  conf: 0.25           # players, referees, hoops
  ball_conf: 0.10      # the ball is small and blurred, so it gets a lower bar
  batch_size: 16
  class_names:         # model class names for each role
    player: [Player]
    referee: [Ref, Referee]
    ball: [Ball]
    hoop: [Hoop]

court:
  standard: nba        # nba | fiba
  keypoint_conf: 0.5   # keypoints below this are ignored
  keypoint_imgsz: 640
  max_flow_frames: 150 # longest stretch the mapping is carried on camera motion alone (5 s at 30 fps)
  smoothing: 0.5       # weight on the camera-tracked mapping when a keypoint fit agrees with it
  reject_m: 1.5        # keypoint fits this far (metres) from the tracked mapping are rejected

tracking:
  track_buffer: 60           # frames a lost track survives (screens in the paint)
  relink_max_gap_s: 1.0      # join a track that ends to one that starts this soon after...
  relink_max_speed_mps: 7.0  # ...if the player could have run between the two points
  smooth_window_s: 0.3       # moving average on court positions
  max_fill_s: 0.5            # gaps up to this long inside a track are interpolated

ball:
  max_speed_px: 90       # per frame; faster jumps are false detections
  max_gap_frames: 20     # image-space gaps up to this are interpolated
  hold_distance: 0.35    # ball-to-hand distance, as a fraction of the player's box height
  max_rel_speed: 1.5     # a held ball moves with the player: under this many box heights per second
  max_flight_s: 3.0      # longest free-ball stretch drawn as a straight ground line

output:
  dir: output
  cache_dir: stubs       # model passes are cached here per video; null disables
  hz: 10                 # samples per second in tracking.parquet
  team_names: [Team A, Team B]
  write_video: true      # annotated video with a top-down minimap, for checking by eye
