# CourtVision default configuration. Every key is optional; anything omitted
# falls back to the defaults in courtvision/config.py.

models:
  detector: models/player_detector.pt        # YOLO detect: Ball, Clock, Hoop, Overlay, Player, Ref, Scoreboard
  ball_detector: null                        # optional dedicated ball model (higher recall on small balls)
  court_keypoints: models/court_keypoints.pt # YOLO pose: 18 court keypoints
  device: null                               # null = auto (cuda if available)

detection:
  imgsz: 1280
  conf: 0.10
  ball_conf: 0.05
  batch_size: 16
  track_buffer: 60                           # frames a lost player track stays alive through occlusion
  class_names:
    player: [Player]
    referee: [Ref]
    ball: [Ball]
    hoop: [Hoop]

teams:
  method: color          # color | clip
  team_names: [Team A, Team B]
  clip_prompts: null     # e.g. ["white jersey", "dark blue jersey"] when method=clip
  samples_per_track: 12

ball:
  max_speed_px_per_frame: 90
  max_gap_frames: 20

possession:
  max_distance_ratio: 0.35   # ball-to-player distance as a fraction of player bbox height
  min_frames: 5              # hysteresis before a possession change is accepted

events:
  interception_max_gap_frames: 45
  shot_window_frames: 45

court:
  standard: nba          # nba | fiba
  keypoint_conf: 0.5
  homography_hold_frames: 15
  homography_smoothing: 0.6   # weight on the camera-tracked mapping when a keypoint fit agrees
  camera_motion: true         # follow pans and zooms with optical flow between keypoint fits
  max_flow_frames: 150        # longest stretch carried on camera motion alone (5 s at 30 fps)
  reject_threshold_m: 1.5     # keypoint fits this far from the tracked mapping are dropped

tracking:
  relink: true                # join player tracks the tracker split in two (same team, reachable, no overlap)
  relink_max_gap_s: 1.0
  relink_max_speed_mps: 6.0
  smooth: true                # remove spikes, fill short gaps, smooth court positions before 3D and metrics
  max_fill_s: 0.5
  smooth_window_s: 0.3

metrics:
  speed_window_frames: 5
  max_speed_mps: 11.0

pose:                      # 3d mode only
  enabled: false           # 2D body keypoints per player, lifted to 3D skeletons in scene.json
  model: yolo11m-pose.pt   # any ultralytics COCO-17 pose model
  imgsz: 1280
  conf: 0.25
  batch_size: 16
  match_iou: 0.4
  min_keypoint_conf: 0.3
  player_height_m: 2.0
  smooth_window: 5

output:
  mode: 2d                 # 2d: court x, y for every player and the ball | 3d: also camera, ball height, scene, viewer
  tracking_fps: 10         # tracking_2d sample rate (null = every video frame); models still run on every frame
  dir: output
  cache_dir: stubs
  write_video: true
  write_3d_html: true      # 3d mode only
  viewer: bodies           # bodies (animated three.js players) | plotly (dots)
  character_glb: null      # optional rigged Mixamo-style .glb used for every player
  write_diagnostics: true  # diagnostics.json, diagnostics_frames.csv, diagnostics.png
