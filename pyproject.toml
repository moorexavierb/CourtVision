[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
description = "Basketball broadcast video to 2D court tracking of every player and the ball, and touch-by-touch events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "plotly>=5.18",
]

[project.optional-dependencies]
# Model inference / training. Kept optional so the pure-geometry and event
# logic can be installed and unit-tested without a GPU stack.
models = [
    "ultralytics>=8.3",
    "supervision>=0.25,<0.31",  # ByteTrack is removed from supervision in 0.31
    "torch>=2.2",
]
clip = ["transformers>=4.40", "pillow>=10.0"]
train = ["roboflow>=1.1"]
dev = ["pytest>=7.4"]

[project.scripts]
courtvision = "courtvision.cli:main"

[tool.setuptools.packages.find]
include = ["courtvision*"]

[tool.setuptools.package-data]
"courtvision.recon3d" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
