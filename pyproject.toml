[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.2.0"
description = "NBA broadcast video to a 10 Hz court tracking dataset of every on-court player and the ball."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Model inference and training. Optional so the geometry and tracking logic can be installed and
# tested without a GPU stack.
models = [
    "ultralytics>=8.3",
    "supervision>=0.25,<0.31",  # ByteTrack is removed from supervision in 0.31
    "torch>=2.2",
]
train = ["roboflow>=1.1", "huggingface_hub>=0.20", "matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
courtvision = "courtvision.cli:main"

[tool.setuptools.packages.find]
include = ["courtvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
